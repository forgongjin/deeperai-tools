    /* Settings */
    .settings {

    /* Actions */

    .free-badge {

    }

    .footer { text-align:center; color:var(--sub); font-size:0.8rem; margin-top:24px; }
    .footer a { color:var(--sub) }
    .hidden { display:none !important }

<body>

  <div class="header">
    <h1>图<span>压</span></h1>
    <p>图片批量压缩 · 格式转换 · 尺寸调整 — 所有处理在本地完成，不上传服务器</p>
  </div>

  <div class="container">
    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone">
      <div class="icon">📁</div>
      <div class="btn" onclick="document.getElementById('fileInput').click()">选择图片</div>
      <div class="tip">或拖拽图片到此处 · 支持 JPG / PNG / WebP / SVG / GIF · <span class="free-badge">免费版 ≤10张/次</span></div>
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
    </div>

    <!-- Settings -->
    <div class="settings" id="settings" class="hidden">
      <div class="setting-group">
        <label>输出格式</label>
        <select id="format">
          <option value="auto">保持原格式</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="setting-group">
        <label>压缩质量: <span id="qualityLabel">80%</span></label>
        <input type="range" id="quality" min="10" max="100" value="80">
      </div>
      <div class="setting-group">
        <label>最大宽度 (px, 0=不变)</label>
        <input type="number" id="maxWidth" value="0" min="0" step="100">
      </div>
    </div>

    <!-- File List -->
    <div class="file-list" id="fileList"></div>

    <!-- Stats (hidden initially) -->
    <div class="stats hidden" id="stats">
      <div class="stat">
        <div class="value" id="statTotal">0</div>
        <div class="label">处理文件</div>
      </div>
      <div class="stat">
        <div class="value" id="statBefore">0 KB</div>
        <div class="label">处理前</div>
      </div>
      <div class="stat">
        <div class="value" id="statAfter">0 KB</div>
        <div class="label">处理后</div>
      </div>
      <div class="stat">
        <div class="value" id="statSaved">0%</div>
        <div class="label">节省空间</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn-process" id="btnProcess" onclick="processAll()">🚀 开始压缩</button>
      <button class="btn-download" id="btnDownload" onclick="downloadAll()">⬇ 下载全部</button>
    </div>

    <!-- Pro Banner -->
    <div class="pro-banner">
      <h3>🚀 图压 Pro</h3>
      <p>无限批量处理 · API接入 · 自动抠图 · 水印添加 · ¥6 永久买断</p>
      <button class="btn-pro" onclick="handleBuy()" style="border:none;cursor:pointer">升级 Pro →</button>
    </div>

    <div class="footer">
      图压 · 你的隐私我们尊重 · 所有图片仅在浏览器本地处理
    </div>
  </div>

  <script>
    const MAX_FREE = 10
    const state = { files: [], results: [], isPro: false }

    // Check if user has Pro from localStorage
    try {
      const saved = localStorage.getItem('tupress_pro')
      if (saved) {
        const data = JSON.parse(saved)
        if (data.expiresAt && Date.now() < data.expiresAt) state.isPro = true
      }
    } catch(e) {}

    function addFiles(fileList) {
      const newFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'))
      const totalAfter = state.files.length + newFiles.length

      if (!state.isPro && totalAfter > MAX_FREE) {
        const remaining = MAX_FREE - state.files.length
        if (remaining > 0) {
          for (let i = 0; i < remaining; i++) {
            state.files.push(newFiles[i])
            state.results.push(null)
          }
        }
        showPaywall(totalAfter)
      } else {
        for (const file of newFiles) {
          state.files.push(file)
          state.results.push(null)
        }
      }
      render()
    }

    function showPaywall(wanted) {
      const overlay = document.createElement('div')
      overlay.className = 'paywall-overlay'
      overlay.id = 'paywall'
      overlay.innerHTML = `
        <div class="paywall-card">
          <h2>升级 <span>图压 Pro</span></h2>
          <div class="limit-info">
            免费版每次最多处理 <b>${MAX_FREE} 张</b> 图片<br>
            你想添加 <b>${wanted} 张</b>，超出限制了
          </div>
          <div class="features">
            <li>无限批量处理</li>
            <li>自动抠图</li>
            <li>水印批量添加</li>
            <li class="pro">API 接口调用</li>
            <li class="pro">优先支持</li>
          </div>
          <button class="btn-buy" onclick="handleBuy()">💰 ¥6 永久买断 · 立即升级</button>
          <button class="btn-skip" onclick="document.getElementById('paywall').remove()">暂不升级，先用免费版</button>
        </div>
      `
      document.body.appendChild(overlay)
    }

    function handleBuy() {
      const checkoutUrl = 'https://wangcaioc.lemonsqueezy.com/checkout/buy/d5002c32-5e24-413d-a261-6415e40aca90'
      LemonSqueezy.Url.Open(checkoutUrl)
    }

    function activatePro() {
      state.isPro = true
      localStorage.setItem('tupress_pro', JSON.stringify({
        expiresAt: Date.now() + 30*24*60*60*1000 // 30 days
      }))
      const pw = document.getElementById('paywall')
      if (pw) pw.remove()
      render()
    }

    // Drag & Drop
    const zone = document.getElementById('uploadZone')
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over') })
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'))
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over')
      addFiles(e.dataTransfer.files)
    })

    document.getElementById('fileInput').addEventListener('change', e => addFiles(e.target.files))
    document.getElementById('quality').addEventListener('input', e => {
      document.getElementById('qualityLabel').textContent = e.target.value + '%'
    })

    function removeFile(index) {
      state.files.splice(index, 1)
      state.results.splice(index, 1)
      render()
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B'
      if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB'
      return (bytes/(1024*1024)).toFixed(2) + ' MB'
    }

    function render() {
      const list = document.getElementById('fileList')
      const hasFiles = state.files.length > 0
      document.getElementById('settings').classList.toggle('hidden', !hasFiles)
      document.getElementById('stats').classList.toggle('hidden', !hasFiles)
      document.getElementById('btnProcess').classList.toggle('hidden', !hasFiles)

      list.innerHTML = state.files.length === 0 
        ? '' 
        : state.files.map((f, i) => {
            const url = URL.createObjectURL(f)
            const ext = f.name.split('.').pop().toUpperCase()
            const result = state.results[i]
            let resultHtml = ''
            if (result === 'processing') resultHtml = '<span class="result">处理中...</span>'
            else if (result) resultHtml = `<span class="result">${formatSize(result.size)} (↓${((1-result.size/f.size)*100).toFixed(0)}%)</span>`
            if (result && result.error) resultHtml = `<span class="result fail">${result.error}</span>`

            return `<div class="file-item">
              <img class="thumb" src="${url}" alt="">
              <div class="info">
                <div class="name" title="${f.name}">${f.name}</div>
                <div class="meta">${formatSize(f.size)} · ${ext} · ${f.type}</div>
                ${resultHtml}
              </div>
              <button class="remove" onclick="removeFile(${i})">✕</button>
            </div>`
          }).join('')

      // Update stats if all processed
      const allDone = state.files.length > 0 && state.results.every(r => r && !r.error)
      if (allDone) {
        const totalBefore = state.files.reduce((s,f) => s+f.size, 0)
        const totalAfter = state.results.reduce((s,r) => s+(r?.size||0), 0)
        document.getElementById('statTotal').textContent = state.files.length
        document.getElementById('statBefore').textContent = formatSize(totalBefore)
        document.getElementById('statAfter').textContent = formatSize(totalAfter)
        document.getElementById('statSaved').textContent = Math.round((1-totalAfter/totalBefore)*100) + '%'
        document.getElementById('btnDownload').classList.add('show')
      } else {
        document.getElementById('btnDownload').classList.remove('show')
      }
    }

    async function processImage(file, index) {
      state.results[index] = 'processing'
      render()

      try {
        const img = await new Promise((resolve, reject) => {
          const img = new Image()
          img.onload = () => resolve(img)
          img.onerror = reject
          img.src = URL.createObjectURL(file)
        })

        const canvas = document.createElement('canvas')
        let w = img.naturalWidth, h = img.naturalHeight
        const maxW = parseInt(document.getElementById('maxWidth').value)
        if (maxW > 0 && w > maxW) { h = Math.round(h * maxW / w); w = maxW }

        canvas.width = w; canvas.height = h
        const ctx = canvas.getContext('2d')
        ctx.drawImage(img, 0, 0, w, h)

        let format = document.getElementById('format').value
        if (format === 'auto') format = file.type === 'image/png' ? 'image/png' : 'image/jpeg'
        if (!['image/jpeg','image/png','image/webp'].includes(format)) format = 'image/jpeg'

        const quality = parseInt(document.getElementById('quality').value) / 100
        const blob = await new Promise(resolve => canvas.toBlob(resolve, format, quality))

        state.results[index] = {
          blob, size: blob.size,
          name: file.name.replace(/\.[^.]+$/, '') + '.' + format.split('/')[1],
          format
        }
      } catch (e) {
        state.results[index] = { error: e.message }
      }
      render()
    }

    async function processAll() {
      const btn = document.getElementById('btnProcess')
      btn.textContent = '⏳ 处理中...'
      btn.classList.add('processing')
      btn.disabled = true

      const promises = state.files.map((f, i) => 
        state.results[i] && !state.results[i].error ? null : processImage(f, i)
      ).filter(Boolean)

      // Process in batches of 4 to avoid memory issues
      for (let i = 0; i < promises.length; i += 4) {
        await Promise.all(promises.slice(i, i+4))
      }

      btn.textContent = '✅ 完成'
      btn.classList.remove('processing')
      btn.disabled = false
      setTimeout(() => { btn.textContent = '🚀 重新压缩'; btn.disabled = false }, 3000)
    }

    async function downloadAll() {
      for (const result of state.results) {
        if (!result || result.error || !result.blob) continue
        const a = document.createElement('a')
        a.href = URL.createObjectURL(result.blob)
        a.download = result.name
        a.click()
        await new Promise(r => setTimeout(r, 200)) // small delay between downloads
      }
    }
  </script>
